---
repos:
  # pre-commit install --all to install whatever in .pre-commit-config.yaml
  # pre-commit run --all-files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-symlinks
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        args: ["--pre-commit", "--redact", "--staged", "--verbose"]

# Security

  - repo: local
    hooks:
      - id: trufflehog-full-scan
        name: TruffleHog - Full Repository Secret Scan
        entry: trufflehog filesystem . --config=.trufflehog.yaml --exclude-paths=.trufflehog-exclude --results=verified,unverified,unknown --fail
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

  # gem needs to be installed
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint
        # args: ["-r", "~MD007,~MD013"]
